<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="ladderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="#0F172A"/>
  <!-- Left pole -->
  <line x1="32" y1="18" x2="32" y2="82" stroke="url(#ladderGrad)" stroke-width="7" stroke-linecap="round"/>
  <!-- Right pole -->
  <line x1="68" y1="18" x2="68" y2="82" stroke="url(#ladderGrad)" stroke-width="7" stroke-linecap="round"/>
  <!-- Steps -->
  <line x1="32" y1="32" x2="68" y2="32" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>
  <line x1="32" y1="50" x2="68" y2="50" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
  <line x1="32" y1="68" x2="68" y2="68" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>
  <!-- Game dot -->
  <circle cx="50" cy="50" r="5" fill="#EF4444" />
</svg>
